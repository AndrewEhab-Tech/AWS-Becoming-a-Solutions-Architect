# /etc/ipsec.conf - StrongSwan configuration for On-Premise Gateway
config setup
    charondebug="all"
    uniqueids=yes

conn aws-vpn-tunnel-1
    authby=secret
    auto=start
    left=%defaultroute
    leftid=203.0.113.12
    leftsubnet=192.168.0.0/16
    right=3.210.15.20 # AWS Tunnel 1 Outside IP
    rightsubnet=10.0.0.0/8
    keyexchange=ikev2
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!
    dpddelay=10s
    dpdtimeout=30s
    dpdaction=restart
